workflows:
  android-build:
    name: Android Build & Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 21
      vars:
        PACKAGE_NAME: "com.aistudio.studymate.ai.app"
    scripts:
      - name: Set up local.properties & permissions
        script: |
          chmod +x gradlew
          if ! ./gradlew --version >/dev/null 2>&1; then
            echo "Repairing corrupted gradle-wrapper.jar..."
            rm -f gradle/wrapper/gradle-wrapper.jar
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 9.3.1
            else
              curl -sSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
              /tmp/gradle-dist/gradle-9.3.1/bin/gradle wrapper --gradle-version 9.3.1
              rm -rf /tmp/gradle.zip /tmp/gradle-dist
            fi
          fi
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
      - name: Build Android Release APK & App Bundle
        script: |
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab
