workflows:
  android-build:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.aistudio.studymate.ai.app"
    scripts:
      - name: Set up permissions & Gradle wrapper
        script: |
          sed -i '' 's/\r$//' gradlew 2>/dev/null || sed -i 's/\r$//' gradlew 2>/dev/null || true
          chmod +x gradlew
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || ! unzip -t gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1 || ! ./gradlew --version >/dev/null 2>&1; then
            echo "Repairing corrupted gradle-wrapper.jar..."
            rm -f gradle/wrapper/gradle-wrapper.jar
            GRADLE_VERSION=$(grep 'distributionUrl' gradle/wrapper/gradle-wrapper.properties | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')
            if [ -z "$GRADLE_VERSION" ]; then GRADLE_VERSION="9.3.1"; fi
            curl -sSL -f "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi
          ./gradlew --version
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk


