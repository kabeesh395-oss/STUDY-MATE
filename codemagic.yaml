workflows:
  android-build:
    name: Android Build & Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 21
      vars:
        PACKAGE_NAME: "com.aistudio.studymate.ai.app"
    scripts:
      - name: Set up local.properties & permissions
        script: |
          chmod +x gradlew
          if ! java -jar gradle/wrapper/gradle-wrapper.jar --version >/dev/null 2>&1; then
            echo "gradle-wrapper.jar is invalid or corrupted. Restoring valid wrapper jar..."
            mkdir -p gradle/wrapper
            curl -fSL https://raw.githubusercontent.com/gradle/gradle/v8.12.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          fi
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
      - name: Build Android Release APK & App Bundle
        script: |
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab
