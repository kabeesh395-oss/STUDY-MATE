name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # Bootstrap the wrapper before setup-gradle: setup-gradle validates the
    # wrapper and fails when gradle-wrapper.jar is absent or corrupt.
    - name: Validate & prepare Gradle Wrapper & Environment
      shell: bash
      run: |
        set -euo pipefail
        sed -i 's/\r$//' gradlew
        chmod +x gradlew

        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env
        fi

        WRAPPER_DIR="gradle/wrapper"
        WRAPPER_JAR="$WRAPPER_DIR/gradle-wrapper.jar"
        WRAPPER_PROPERTIES="$WRAPPER_DIR/gradle-wrapper.properties"

        if [ ! -f "$WRAPPER_PROPERTIES" ]; then
          echo "::error::Missing $WRAPPER_PROPERTIES"
          exit 1
        fi

        if [ ! -f "$WRAPPER_JAR" ] || ! unzip -t "$WRAPPER_JAR" >/dev/null 2>&1; then
          echo "Gradle wrapper JAR is missing or invalid; downloading the official wrapper JAR."
          GRADLE_VERSION="$(sed -n 's/.*gradle-\([0-9][0-9.]*\)-.*/\1/p' "$WRAPPER_PROPERTIES" | head -n 1)"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::Could not determine Gradle version from $WRAPPER_PROPERTIES"
            exit 1
          fi
          mkdir -p "$WRAPPER_DIR"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar" \
            --output "$WRAPPER_JAR"
          unzip -t "$WRAPPER_JAR" >/dev/null
        fi

        ./gradlew --version

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run Android unit tests
      run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
