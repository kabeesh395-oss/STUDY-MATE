name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate & repair Gradle Wrapper
      run: |
        if ! unzip -t gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1 || ! ./gradlew --version >/dev/null 2>&1; then
          echo "gradle-wrapper.jar is invalid or corrupted. Repairing wrapper..."
          rm -f gradle/wrapper/gradle-wrapper.jar
          GRADLE_VERSION=$(grep 'distributionUrl' gradle/wrapper/gradle-wrapper.properties | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')
          if [ -z "$GRADLE_VERSION" ]; then GRADLE_VERSION="9.3.1"; fi
          echo "Downloading gradle-wrapper.jar for Gradle $GRADLE_VERSION..."
          curl -sSL -f "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
        fi
        ./gradlew --version

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
